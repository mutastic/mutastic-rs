# cargo-deny's checks of the dependencies, run in CI (.github/workflows/audit.yml): known
# vulnerabilities, licences mutastic can be shipped with, and where crates come from.

[graph]
all-features = true

[advisories]
# Unmaintained crates fail only when mutastic depends on them directly: a transitive one is the
# direct dependency's to replace.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# The licences the dependencies use today, each compatible with shipping mutastic under
# Apache-2.0. cargo-deny warns about one no dependency uses, so the list stays exactly what's used,
# and a new one is added here on purpose.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are `publish = false`: releases go to GitHub, not crates.io.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A workspace crate's path dependency on another, mutastic's on mutastic-terminal, has no version;
# it's allowed only between crates that aren't published. A registry dependency still needs one.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
