# cargo-deny's checks of the dependencies, run in CI (.github/workflows/audit.yml): known
# vulnerabilities, licences mutastic can be shipped with, and where crates come from.

[graph]
all-features = true

[advisories]
# Unmaintained crates fail only when mutastic depends on them directly: a transitive one is the
# direct dependency's to replace.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Licences compatible with shipping mutastic under Apache-2.0. A new one is added here on purpose,
# never by widening a pattern.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are `publish = false` until the first release.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
