# mutastic on the corpus (corpus/corpus.yaml): real crates, each pinned to a commit, a share of each
# one's mutants, every night and before every release. The fixtures hold the shapes we thought of;
# real crates hold the ones people write, and the bugs that matter turned up there: a crate its own
# dev-dependencies pulled in again, modules declared in a macro, a mutant no limit stopped.
#
# Each crate is a job of its own (scripts/corpus-run.sh, through `just corpus`): cloned at its
# commit, its own tests, then mutastic as events and again for an agent. A crate passes when its
# expectation holds. The last job puts the result lines in a table on the run's page, against the
# last good nightly's: a crate that passed then and fails now is the alert, named, and the run is
# red. A crate that fails both times, a crate whose own tests fail, and a refusal the corpus expects
# show in the table and leave the run green. A crate's job may fail without failing the run.
#
# Before a release, run it on the release's branch: gh workflow run corpus.yml --ref <branch>;
# with only: <name> (or several, by spaces or commas), just those.
#
# Corpus crates are other people's code: they're cloned, built and run here, never on a
# contributor's machine. Actions are pinned to a commit: a tag can be moved.
name: Corpus

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: The crates to run, by name, spaces or commas between; all of them when empty.
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One run at a time: a second waits for the first.
concurrency:
  group: corpus
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The mutastic `just corpus` runs: the build job's, downloaded to bin/.
  MUTASTIC_SELF_BIN: bin/mutastic

jobs:
  # The corpus checked, and its names, or those `only` picks, for the matrix.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.59.0
      - id: names
        env:
          ONLY: ${{ inputs.only }}
        run: |
          names=$(just corpus --matrix "$ONLY")
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Crates: $names"

  # mutastic, built once from this commit, for every crate.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 16 Oct 2026
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.59.0
      - run: just self-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutastic
          path: target/release/mutastic
          retention-days: 1

  crate:
    name: ${{ matrix.name }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The night's verdict is the report job's: a crate that fails both times is known, not news.
    continue-on-error: true
    strategy:
      fail-fast: false
      # The account runs 20 jobs at once; a pull request's checks take 9 to 15 of them.
      max-parallel: 6
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 16 Oct 2026
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutastic
          path: bin
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.59.0
      - run: chmod +x bin/mutastic
      - name: Run ${{ matrix.name }}
        env:
          NAME: ${{ matrix.name }}
        run: just corpus "$NAME"
      # The result line, the runs' events, logs and agent text; not the clone.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-${{ matrix.name }}
          path: ${{ runner.temp }}/corpus/out/
          retention-days: 7

  # The result lines as one file and a table, against the last good nightly's: red only when a
  # crate that passed then fails now.
  report:
    needs: [plan, crate]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To find the last good run and download its results.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.59.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: corpus-*
          path: results
          merge-multiple: true
      # The last nightly that passed, or with none yet (on a branch), this branch's last run that
      # passed: its corpus-results.
      - name: The last good run's results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
        run: |
          mkdir -p previous
          for filter in "--event=schedule" "--branch=$BRANCH"; do
            for id in $(gh run list --repo "$REPO" --workflow=corpus.yml --status=success "$filter" \
                --limit=10 --json databaseId --jq '.[].databaseId'); do
              [ "$id" = "$RUN" ] && continue
              if gh run download "$id" --repo "$REPO" --name corpus-results --dir previous 2> /dev/null; then
                echo "Comparing with run $id."
                exit 0
              fi
            done
          done
          echo "No earlier run to compare with."
      - name: Put the results together
        env:
          NAMES: ${{ join(fromJSON(needs.plan.outputs.names), ' ') }}
        run: |
          status=0
          # shellcheck disable=SC2086 # a word for each name
          just corpus --summary results previous/corpus-results.jsonl $NAMES > summary.md || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" < summary.md
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-results
          path: results/corpus-results.jsonl
          if-no-files-found: error
          retention-days: 90
