# Commit messages: every new commit in a push or pull request follows Conventional Commits and
# 50/72, checked by the same script as the commit-msg hook (.githooks/). Commits from before the
# hook was added keep the older style and aren't checked. A pull request's title is checked too,
# as the subject its squash merge will write, and in the merge queue the squash commit itself.
# Takes seconds. Actions are pinned to a commit: a tag can be moved.
name: Commits

on:
  push:
    branches: [main]
  pull_request:
    # edited: a new title needs checking again.
    types: [opened, edited, synchronize, reopened]
  # The merge queue: main as it will be, with the pull request's squash commit, and those of the
  # pull requests ahead of it, on top.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A pull request's new push cancels the run for its last one, which no one will read. Every other
# run has a group of its own, so a run of the merge queue or main is never cancelled, nor kept
# waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to find the commit that added the hook.
          fetch-depth: 0
      - run: sh .githooks/test-commit-msg
      - run: sh .githooks/check-commits "$BASE" "$HEAD_SHA"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

  # The squash merge writes "<title> (#<number>)" on main, a commit no other check sees before it
  # is queued; so on a pull request the title, with that suffix, must pass commit-msg. In the
  # merge queue the squash commit exists, written as it will land, so its whole message is checked
  # instead, body and all, with no line starting with # (git would strip it, GitHub keeps it).
  squash-title:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'pull_request'
        run: sh .githooks/check-title "$NUMBER" "$TITLE"
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
      - if: github.event_name == 'merge_group'
        run: |
          git log -1 --format=%B "$HEAD_SHA" > "$RUNNER_TEMP/message"
          sed 's/^/  /' "$RUNNER_TEMP/message"
          if grep -n '^#' "$RUNNER_TEMP/message"; then
            echo "The squash commit has lines starting with #, which the check would skip." >&2
            exit 1
          fi
          sh .githooks/commit-msg "$RUNNER_TEMP/message"
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}

  # The changelog: each entry is a file in changes/, as pull requests that all added to the end of
  # CHANGELOG.md conflicted and dropped each other from the merge queue. So the files must sit in
  # a known section, shaped as entries, and only a release, "chore(release): version X.Y.Z", may
  # edit CHANGELOG.md: on a pull request its title says, in the merge queue and on main each
  # commit's subject. scripts/changelog.sh says what's wrong and how to put it right.
  #
  # A release, "chore(release): version X.Y.Z", is checked as one before it can merge, by
  # scripts/release-check.sh: here what takes seconds, the changelog's rules for that version, the
  # version, the contract's pins and its release rule at the pin; the ids, which need a build, in
  # ci.yml.
  #
  # And the justfile, whose recipes CI runs: formatted as `just --fmt` writes it, and with the
  # verbs .github/just-verbs.txt lists, so none goes or comes unseen.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: just@1.59.0
      - run: just justfile-check
      - run: just changelog-check "$BASE" "$HEAD_SHA" "$TITLE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
      - run: sh scripts/test-changelog.sh
      - name: A release is ready to tag
        if: github.event_name != 'push'
        run: sh scripts/release-check.sh --no-build --subject "${TITLE:-$(git log -1 --format=%s "$HEAD_SHA")}"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          TITLE: ${{ github.event.pull_request.title }}
