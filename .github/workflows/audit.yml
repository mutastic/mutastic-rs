# The dependencies, checked with cargo-deny against deny.toml: known vulnerabilities, licences and
# sources. On every push, pull request and merge queue entry, and weekly, since a new advisory
# needs no change here. Actions are pinned to a commit: a tag can be moved.
name: Audit

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: each pull request merged with main and those ahead of it, before it lands.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A pull request's new push cancels the run for its last one, which no one will read. Every other
# run has a group of its own, so a run of the merge queue or main is never cancelled, nor kept
# waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
