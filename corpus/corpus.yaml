# The corpus: real crates mutastic runs on every night, and before every release
# (.github/workflows/corpus.yml, scripts/corpus-run.sh). The fixtures hold the shapes we thought
# of; these hold the ones people write, where the bugs that matter turned up (a dev-dependency
# that pulls the crate in again, modules declared in a macro, a mutant no limit stopped).
#
# One crate a line:
#   name     what the results call it, unique
#   git      the repository, quoted
#   commit   the full commit it runs at: a pin, never a branch or tag, so a night that fails
#            is mutastic's change, not the crate's
#   package  the package's directory, relative to the clone
#   shard    N for --shard=1/N: a share of about 30 to 60 mutants (64 is the most N can be)
#   shapes   what it covers that the others don't
#   expect   score: a run that ends with a report and a score; or refused:<code>, when refusing
#            it is right today: it passes when that code comes back
#   note     why, for a refusal or a known gap
#
# To add a crate:
# 1. Pick it for a shape the others don't cover, and say which in shapes.
# 2. Pin a commit, the whole hash.
# 3. Set shard so a share is 30 to 60 mutants (`mutastic mutants <pkg>` counts them, on its last
#    line), and the job fits in its 30 minutes.
# 4. Set expect: score, or refused:<code> with a note saying why the refusal is right.
# Then run the workflow on your branch with only: <name>.
#
# Surveyed 23 Nov 2026 (mutastic-rs 1.3.0, rustc 1.99.1). A failure here becomes a fixture in
# the pull request that fixes it.
