[package]
name = "cases"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

# The one fixture with dependencies: the frameworks whose tests it holds. Cargo.lock pins them, so
# every run builds and seeds the same versions.
[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
rstest = { version = "0.23", default-features = false }
test-case = "3"
