[workspace]
members = ["crates/mutastic", "crates/cargo-mutastic", "crates/mutastic-rs"]
exclude = ["fixtures"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mutastic/mutastic-rs"
homepage = "https://mutastic.io"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
