[workspace]
members = ["crates/mutastic", "crates/cargo-mutastic", "crates/mutastic-rs"]
exclude = ["fixtures"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mutastic/mutastic-rs"
homepage = "https://mutastic.io"
documentation = "https://github.com/mutastic/mutastic-rs/tree/main/docs"
readme = "README.md"
keywords = ["mutation-testing", "testing", "mutants", "test-quality", "cargo"]
categories = ["development-tools::testing", "development-tools::cargo-plugins", "command-line-utilities"]
# The oldest toolchain that builds mutastic, set by its parser's (ra_ap_syntax). CI builds on it.
# The crates mutastic tests build with their own toolchain, not this one.
rust-version = "1.91"

[workspace.lints.rust]
# Denied everywhere but `terminal`, which asks the C library for the terminal's width, its input
# mode and signals, rather than take a dependency for a handful of calls; a test keeps it there.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# What the code already does, kept so: no `unwrap` outside tests (clippy.toml allows it there),
# every `#[allow]` says why beside it, and a set's `insert` answers whether it was new.
unwrap_used = "warn"
allow_attributes_without_reason = "warn"
set_contains_or_insert = "warn"

# Dependencies optimised in dev and test builds, mutastic's own crate not: the integration tests
# run mutastic hundreds of times, and its parsing, regexes and JSON unoptimised made each run five
# times slower (0.87s to 0.16s on the pricing fixture). Dependencies build once and stay cached; a
# change to mutastic itself, and each of its mutants in a self-run, builds as fast as before.
[profile.dev.package."*"]
opt-level = 3
