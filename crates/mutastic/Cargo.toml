[package]
name = "mutastic"
description = "Mutation testing for Rust: find the tests that run your code but don't check it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mutastic"
path = "src/bin/mutastic.rs"

[[bin]]
name = "cargo-mutastic"
path = "src/bin/cargo-mutastic.rs"

[dependencies]
# The terminal's width, its input mode and signals: the workspace's one crate with unsafe code.
mutastic-terminal = { path = "../mutastic-terminal" }
# rust-analyzer's parser: error-tolerant and lossless. Pinned, and moved forward on purpose,
# because it ships about weekly as 0.0.x.
ra_ap_syntax = "=0.0.331"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
regex = "1"

# Where cargo-binstall finds a release's build of `mutastic` and `cargo-mutastic`, as the release
# workflow names them: a `.tar.gz` on macOS and Linux, a `.zip` on Windows.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mutastic-{ version }-{ target }{ archive-suffix }"
bin-dir = "mutastic-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
